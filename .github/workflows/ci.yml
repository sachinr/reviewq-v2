name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The sandbox that builds this app has no Postgres/Redis/live Slack, so the
# DATABASE_URL- and REDIS_URL-gated integration tests are skipped there and run
# here instead, against real service containers. Pure business logic still runs
# everywhere. Keeping both in one `npm test` invocation means the gated suites
# light up automatically the moment the env vars are present.
jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reviewed_test
      REDIS_URL: redis://127.0.0.1:6379

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reviewed_test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test (unit + DATABASE_URL/REDIS_URL integration suites)
        run: npm test
